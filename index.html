<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green & Ethical Investor Screener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="panel">
        <h1>Investor Screener</h1>
        <p class="muted">
          Filter tradeable stocks and ETFs by green and ethical score.
        </p>

        <label class="field-label" for="search">Search</label>
        <input
          id="search"
          type="text"
          placeholder="Search name, ticker, exchange"
        />

        <div class="slider-row">
          <label class="field-label" for="greenSlider">Minimum green score</label>
          <span id="greenValue" class="value-pill">55</span>
        </div>
        <input id="greenSlider" type="range" min="0" max="100" step="1" value="55" />

        <div class="slider-row">
          <label class="field-label" for="ethicalSlider">Minimum ethical score</label>
          <span id="ethicalValue" class="value-pill">55</span>
        </div>
        <input id="ethicalSlider" type="range" min="0" max="100" step="1" value="55" />

        <label class="field-label" for="typeFilter">Instrument type</label>
        <select id="typeFilter">
          <option value="all">All</option>
          <option value="stock">Stocks</option>
          <option value="etf">ETFs</option>
        </select>

        <label class="field-label" for="sortFilter">Sort by</label>
        <select id="sortFilter">
          <option value="combined_desc">Best overall</option>
          <option value="green_desc">Highest green</option>
          <option value="ethical_desc">Highest ethical</option>
          <option value="name_asc">Name A–Z</option>
          <option value="name_desc">Name Z–A</option>
        </select>

        <div class="helper-box">
          <strong>How it works</strong>
          <p>
            Stocks use stored company scores from your database.
            ETFs currently use stored ETF scores from your database.
          </p>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Matches</div>
          <div class="stat-value" id="matchCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Average green</div>
          <div class="stat-value" id="avgGreen">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Average ethical</div>
          <div class="stat-value" id="avgEthical">0</div>
        </div>
      </div>

      <div id="results" class="results-grid">
        <div class="card no-results">Loading...</div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
